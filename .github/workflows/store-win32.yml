# Store-flavor (Win32 EXE) build + verification. NEVER publishes anywhere:
# artifacts are archived to the workflow run only.
# Fails closed: without signing secrets the job stops before building
# (unless allow_unsigned=true is explicitly chosen for an RC smoke build).
name: store-win32

on:
  push:
    branches:
      - codex/v6-macos-app-store
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'RC-only smoke build without signing (never submittable)'
        type: boolean
        default: false
      enable_self_update:
        description: 'Bake store-win32 in-app self-update (signed channel)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-store:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend deps
        run: npm ci

      - name: Download pinned Windows runtimes
        shell: pwsh
        run: |
          $runtime = Get-Content runtime-versions.json -Raw | ConvertFrom-Json

          $xray = $runtime.xray.assets.windows_amd64
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$($runtime.xray.version)/$($xray.name)" -OutFile xray.zip
          if ((Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $xray.sha256) {
            throw 'Xray archive checksum mismatch'
          }
          Expand-Archive xray.zip xray-core-tmp
          New-Item -ItemType Directory -Force src-tauri/xray-core | Out-Null
          Copy-Item xray-core-tmp/xray.exe src-tauri/xray-core/
          Copy-Item xray-core-tmp/geoip.dat src-tauri/xray-core/
          Copy-Item xray-core-tmp/geosite.dat src-tauri/xray-core/

          Invoke-WebRequest "https://www.wintun.net/builds/$($runtime.wintun.asset)" -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtime.wintun.sha256) {
            throw 'Wintun archive checksum mismatch'
          }
          Expand-Archive wintun.zip wintun-tmp
          Copy-Item wintun-tmp/wintun/bin/amd64/wintun.dll src-tauri/xray-core/
          Copy-Item wintun-tmp/wintun/bin/amd64/wintun.dll src-tauri/

          $singBox = $runtime.sing_box.assets.windows_amd64
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$($runtime.sing_box.version)/$($singBox.name)" -OutFile sing-box.zip
          if ((Get-FileHash sing-box.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $singBox.sha256) {
            throw 'sing-box archive checksum mismatch'
          }
          Expand-Archive sing-box.zip sing-box-tmp
          $singBoxExe = Get-ChildItem sing-box-tmp -Recurse -Filter sing-box.exe | Select-Object -First 1
          if (-not $singBoxExe) { throw 'sing-box.exe not found' }
          Copy-Item $singBoxExe.FullName src-tauri/sing-box.exe

      - name: Test shared UI and Windows runtime
        shell: pwsh
        run: |
          npm test
          npm run build
          if (-not (Test-Path 'src-tauri/DoodleRayService.exe')) {
            New-Item -ItemType File -Path 'src-tauri/DoodleRayService.exe' -Force | Out-Null
          }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --features windows-service --bin DoodleRayService

      - name: Build tunnel service
        shell: pwsh
        run: |
          cargo build --release --manifest-path src-tauri/Cargo.toml --features windows-service --bin DoodleRayService
          Copy-Item src-tauri/target/release/DoodleRayService.exe src-tauri/DoodleRayService.exe -Force

      # Fail closed: signing secrets are mandatory unless allow_unsigned.
      - name: Import code-signing certificate
        if: ${{ !inputs.allow_unsigned }}
        shell: pwsh
        env:
          STORE_CODESIGN_PFX_B64: ${{ secrets.STORE_CODESIGN_PFX_B64 }}
          STORE_CODESIGN_PFX_PASSWORD: ${{ secrets.STORE_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_CODESIGN_PFX_B64)) {
            throw 'STORE_CODESIGN_PFX_B64 secret is not configured. Store builds must be signed; rerun with allow_unsigned=true only for an RC smoke build.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'store-codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:STORE_CODESIGN_PFX_B64))
          $pfxPassword = ConvertTo-SecureString $env:STORE_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pfxPassword
          Remove-Item $pfx -Force
          "WINDOWS_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Sign bundled PE files
        if: ${{ !inputs.allow_unsigned }}
        shell: pwsh
        run: ./scripts/sign-all-pe.ps1 -IncludeVendored

      - name: Build store flavor
        shell: pwsh
        run: |
          $extra = @()
          if ('${{ inputs.allow_unsigned }}' -eq 'true') { $extra += '-AllowUnsigned' }
          if ('${{ inputs.enable_self_update }}' -eq 'true') { $extra += @('-EnableSelfUpdate', '-WithUpdaterArtifacts') }
          ./scripts/build-store.ps1 @extra

      - name: Verify signatures (gate)
        if: ${{ !inputs.allow_unsigned }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist-store -Filter '*.exe' | Select-Object -First 1
          ./scripts/verify-signatures.ps1 -IncludeBuiltApp -InstallerPath $installer.FullName
          if ($LASTEXITCODE -ne 0) { exit 1 }

      # Archive to the run only — no release, no publishing.
      - name: Archive store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: doodleray-store-win32
          path: dist-store/
          retention-days: 14
