name: One-time secret cutover

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
      APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      DOWNLOADS_SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_SSH_PRIVATE_KEY }}
      DOWNLOADS_SSH_PRIVATE_KEY_B64: ${{ secrets.DOWNLOADS_SSH_PRIVATE_KEY_B64 }}
      MACOS_APP_STORE_EXTENSION_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_EXTENSION_PROFILE_BASE64 }}
      MACOS_APP_STORE_HOST_PROFILE_BASE64: ${{ secrets.MACOS_APP_STORE_HOST_PROFILE_BASE64 }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64 }}
      MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      CUTOVER_PUBLIC_KEY: |
        -----BEGIN PUBLIC KEY-----
        MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAwNELuHHU5BAen//PKwy1
        wUS23gZrpaQY6GHx4AdOqPqYm8aKXn2Pi5itfjbUuI8rND6XMdZQW4pVkygcAaw7
        XwKPCQPOGdgITApSPxQ9/qtEGtk4UVoS63q07JvRXhdJDQhI1FQrX39t08ud/jC5
        uGMQV2vl3WJdIgcOoFU6mOPLFmKKVMs+uFhDDcIZz1gg3Z8eNN2IW0acO+4JpdQN
        RjNG9/ENIG1ng1qPcjS6uFeebes3M5wcWdYqgvVlBMk6TWSO43/Q1RJvmiaqGejG
        0sI0PomOhaZWdUDAM/MV+qYRGjQB8FWary2bZy1hfoWpWE2PEeXBCIMNRfk3Jbr6
        1ECMnlCmK4BDsgs/ggA+qKALOi1DdObNULGoQM68MyUVnyPJrgL51+JWlDyx0okJ
        xtGfk4c1iFMN2asdB3oAoEI9D+Ku6/wus3tCigrRncTdPCZzLFXYs5Oeag63cSNi
        YagUyWwuVWUutiQOkS52+AyFQUALHnI4R2zJllJrb1HXRpTmmyoppuJuGnylHN78
        Zc7icCAhEBt48nd4vS2IPxdKC5ny5D1KiVQETokOSSehauXbCvAFEHL3eDTZxL5n
        5ScLw1irA7CkQUGfEVf9q9AbXTf+KoNIhk0pq4uHuS252+GEuoiri3kzOxIGI3xd
        DG85QpcP1oR4nhpyKfF0FwkCAwEAAQ==
        -----END PUBLIC KEY-----

    steps:
      - name: Encrypt repository secrets for target cutover
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const { constants, createCipheriv, publicEncrypt, randomBytes } = require('node:crypto');
          const { writeFileSync } = require('node:fs');

          const names = [
            'APPLE_CERTIFICATE',
            'APPLE_CERTIFICATE_PASSWORD',
            'APPLE_DISTRIBUTION_CERTIFICATE_BASE64',
            'APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD',
            'APPLE_ID',
            'APPLE_PASSWORD',
            'APPLE_SIGNING_IDENTITY',
            'APPLE_TEAM_ID',
            'APP_STORE_CONNECT_API_KEY_ID',
            'APP_STORE_CONNECT_ISSUER_ID',
            'APP_STORE_CONNECT_PRIVATE_KEY',
            'DOWNLOADS_SSH_PRIVATE_KEY',
            'DOWNLOADS_SSH_PRIVATE_KEY_B64',
            'MACOS_APP_STORE_EXTENSION_PROFILE_BASE64',
            'MACOS_APP_STORE_HOST_PROFILE_BASE64',
            'MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_BASE64',
            'MAC_INSTALLER_DISTRIBUTION_CERTIFICATE_PASSWORD',
            'TAURI_SIGNING_PRIVATE_KEY',
            'TAURI_SIGNING_PRIVATE_KEY_PASSWORD',
          ];
          const payload = {};
          for (const name of names) {
            const value = process.env[name] ?? '';
            if (!value) throw new Error(`Required source secret is unavailable: ${name}`);
            payload[name] = value;
          }

          const aesKey = randomBytes(32);
          const iv = randomBytes(12);
          const cipher = createCipheriv('aes-256-gcm', aesKey, iv);
          const ciphertext = Buffer.concat([
            cipher.update(Buffer.from(JSON.stringify(payload))),
            cipher.final(),
          ]);
          const wrappedKey = publicEncrypt({
            key: process.env.CUTOVER_PUBLIC_KEY,
            oaepHash: 'sha256',
            padding: constants.RSA_PKCS1_OAEP_PADDING,
          }, aesKey);

          writeFileSync('doodleray-secret-cutover.enc.json', JSON.stringify({
            version: 1,
            iv: iv.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'),
            wrappedKey: wrappedKey.toString('base64'),
            ciphertext: ciphertext.toString('base64'),
          }));
          NODE

      - name: Upload encrypted cutover bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doodleray-secret-cutover
          path: doodleray-secret-cutover.enc.json
          if-no-files-found: error
          retention-days: 1
