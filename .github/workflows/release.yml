name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      DOODLERAY_CLOSED_CONTROL_PLANE: "1"
      VITE_DOODLERAY_CLOSED_CONTROL_PLANE: "1"
      VITE_DOODLERAY_BUILD_CHANNEL: "direct"
      VITE_DOODLERAY_UPDATE_CHANNEL: "direct"
      VITE_DOODLERAY_DIAGNOSTICS_TELEMETRY: "0"
      WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
      WINDOWS_CODESIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PFX_PASSWORD }}
      WINDOWS_CODESIGN_REQUIRED: "true"
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Install frontend dependencies
        run: npm ci

      - name: Verify release signing secrets
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_BASE64)) {
            throw "WINDOWS_CODESIGN_PFX_BASE64 is required for Windows releases"
          }
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CODESIGN_PFX_PASSWORD)) {
            throw "WINDOWS_CODESIGN_PFX_PASSWORD is required for Windows releases"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is required for updater artifacts"
          }
        shell: pwsh

      # Download xray-core for Windows
      - name: Download xray-core
        run: |
          $runtime = Get-Content runtime-versions.json -Raw | ConvertFrom-Json
          $xrayVersion = $runtime.xray.version
          $xrayAsset = $runtime.xray.assets.windows_amd64
          $url = "https://github.com/XTLS/Xray-core/releases/download/$xrayVersion/$($xrayAsset.name)"
          Invoke-WebRequest -Uri $url -OutFile xray.zip
          if ((Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $xrayAsset.sha256) {
            throw "Xray archive checksum mismatch"
          }
          Expand-Archive -Path xray.zip -DestinationPath xray-core-tmp
          New-Item -ItemType Directory -Force -Path "src-tauri/xray-core"
          Copy-Item "xray-core-tmp/xray.exe" "src-tauri/xray-core/"
          Copy-Item "xray-core-tmp/geoip.dat" "src-tauri/xray-core/"
          Copy-Item "xray-core-tmp/geosite.dat" "src-tauri/xray-core/"
          # Download wintun.dll for TUN
          $wintunUrl = "https://www.wintun.net/builds/$($runtime.wintun.asset)"
          Invoke-WebRequest -Uri $wintunUrl -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtime.wintun.sha256) {
            throw "Wintun archive checksum mismatch"
          }
          Expand-Archive -Path wintun.zip -DestinationPath wintun-tmp
          Copy-Item "wintun-tmp/wintun/bin/amd64/wintun.dll" "src-tauri/xray-core/"
          Copy-Item "wintun-tmp/wintun/bin/amd64/wintun.dll" "src-tauri/"
        shell: pwsh

      - name: Download sing-box
        run: |
          $runtime = Get-Content runtime-versions.json -Raw | ConvertFrom-Json
          $singBoxVersion = $runtime.sing_box.version
          $singBoxAsset = $runtime.sing_box.assets.windows_amd64
          $singBoxZip = Join-Path $env:RUNNER_TEMP "sing-box-windows-amd64.zip"
          $singBoxExtract = Join-Path $env:RUNNER_TEMP "sing-box-windows-amd64"
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$singBoxVersion/$($singBoxAsset.name)" -OutFile $singBoxZip
          if ((Get-FileHash $singBoxZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $singBoxAsset.sha256) {
            throw "sing-box archive checksum mismatch"
          }
          Expand-Archive -Path $singBoxZip -DestinationPath $singBoxExtract -Force
          $singBoxExe = Get-ChildItem $singBoxExtract -Recurse -Filter "sing-box.exe" | Select-Object -First 1
          if (-not $singBoxExe) { throw "sing-box.exe not found in downloaded archive" }
          Copy-Item $singBoxExe.FullName "src-tauri/sing-box.exe" -Force
        shell: pwsh

      - name: Build tunnel service
        run: |
          # tauri-build validates configured bundle resources even for this service-only binary.
          # The real service exe replaces this placeholder immediately after compilation.
          if (-not (Test-Path "src-tauri/DoodleRayService.exe")) {
            New-Item -ItemType File -Path "src-tauri/DoodleRayService.exe" -Force | Out-Null
          }
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin DoodleRayService --features windows-service
          Copy-Item "src-tauri/target/release/DoodleRayService.exe" "src-tauri/" -Force
        shell: pwsh

      # Configure Tauri to bundle external binaries.
      - name: Setup external resources
        run: |
          if (Test-Path "src-tauri/xray-core/wintun.dll") {
            Copy-Item "src-tauri/xray-core/wintun.dll" "src-tauri/wintun.dll" -Force
          }
          # Copy binaries to where Tauri build expects them
          $targetDir = "src-tauri/target/release"
          New-Item -ItemType Directory -Force -Path "$targetDir/xray-core"
          Copy-Item "src-tauri/xray-core/*" "$targetDir/xray-core/" -Recurse
          Copy-Item "src-tauri/sing-box.exe" "$targetDir/" -ErrorAction SilentlyContinue
          Copy-Item "src-tauri/wintun.dll" "$targetDir/" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Import Windows code signing certificate
        if: env.WINDOWS_CODESIGN_PFX_BASE64 != ''
        run: |
          $pfxPath = Join-Path $env:RUNNER_TEMP "doodleray-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))
          $securePassword = ConvertTo-SecureString $env:WINDOWS_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          if (-not $cert.Thumbprint) { throw "Imported code signing certificate has no thumbprint" }
          "WINDOWS_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Sign Windows runtime binaries
        if: env.WINDOWS_CODESIGN_PFX_BASE64 != ''
        run: |
          $files = @(
            "src-tauri/DoodleRayService.exe",
            "src-tauri/sing-box.exe",
            "src-tauri/wintun.dll",
            "src-tauri/xray-core/xray.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required signing target is missing: $file" }
            & "src-tauri/sign-windows-if-configured.ps1" $file
          }
        shell: pwsh

      - name: Verify signed Windows runtime binaries
        run: |
          $files = @(
            "src-tauri/DoodleRayService.exe",
            "src-tauri/sing-box.exe",
            "src-tauri/wintun.dll",
            "src-tauri/xray-core/xray.exe"
          )
          foreach ($file in $files) {
            if (-not (Test-Path $file)) { throw "Required signed file is missing: $file" }
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature is not valid for $file: $($sig.Status) $($sig.StatusMessage)"
            }
          }
        shell: pwsh

      # Strip trailing whitespace/newlines from signing key
      - name: Clean signing key
        shell: bash
        run: |
          KEY=$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> $GITHUB_ENV
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DoodleRay ${{ github.ref_name }}"
          releaseBody: |
            ## 📦 Downloads

            Pick the right installer for your operating system:

            ### 🪟 Windows
            | File | Description |
            |------|-------------|
            | `DoodleRay_x.x.x_x64-setup.exe` | Windows installer (64-bit) — **recommended** |
            | `DoodleRay_x.x.x_x64-setup.nsis.zip` | Portable NSIS archive |

            ### 🍎 macOS
            | File | Description |
            |------|-------------|
            | `DoodleRay_x.x.x_aarch64.dmg` | macOS installer for Apple Silicon (M1/M2/M3/M4) — **recommended for modern Macs** |
            | `DoodleRay_x.x.x_x64.dmg` | macOS installer for Intel Macs |

            ### 🔄 Auto-update
            `latest.json` is used by the built-in updater — you don't need to download it manually.

            ---
            > **Tip:** If you're not sure which file to pick — on **Windows** grab the `.exe`, on **Mac** grab the `.dmg` matching your chip (Apple Silicon = `aarch64`, Intel = `x64`).
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'BETA') }}

      - name: Verify signed Windows release artifacts
        run: |
          $patterns = @(
            "src-tauri/target/release/DoodleRay.exe",
            "src-tauri/target/release/bundle/nsis/*.exe"
          )
          $files = foreach ($pattern in $patterns) { Get-ChildItem $pattern -ErrorAction SilentlyContinue }
          if (-not $files -or $files.Count -eq 0) {
            throw "No Windows release artifacts found for Authenticode verification"
          }
          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file.FullName
            if ($sig.Status -ne 'Valid') {
              throw "Authenticode signature is not valid for $($file.FullName): $($sig.Status) $($sig.StatusMessage)"
            }
          }
        shell: pwsh

  build-macos:
    needs: build-windows
    runs-on: macos-latest
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      DOODLERAY_CLOSED_CONTROL_PLANE: "1"
      VITE_DOODLERAY_CLOSED_CONTROL_PLANE: "1"
      VITE_DOODLERAY_BUILD_CHANNEL: "direct"
      VITE_DOODLERAY_UPDATE_CHANNEL: "direct"
      VITE_DOODLERAY_DIAGNOSTICS_TELEMETRY: "0"
    strategy:
      max-parallel: 1
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: amd64
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      
      - name: Install frontend dependencies
        run: npm ci

      - name: Verify macOS release secrets
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_PRIVATE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Required macOS release secret is missing: ${name}" >&2
              exit 1
            fi
          done

      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      # Download xray-core for macOS
      - name: Download xray-core
        run: |
          XRAY_VERSION="$(node -p "require('./runtime-versions.json').xray.version")"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            XRAY_KEY="darwin_arm64"
          else
            XRAY_KEY="darwin_amd64"
          fi
          XRAY_ASSET="$(node -p "require('./runtime-versions.json').xray.assets.${XRAY_KEY}.name")"
          XRAY_SHA256="$(node -p "require('./runtime-versions.json').xray.assets.${XRAY_KEY}.sha256")"
          curl --fail --location "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/${XRAY_ASSET}" -o xray.zip
          printf '%s  %s\n' "$XRAY_SHA256" xray.zip | shasum -a 256 -c -
          unzip xray.zip -d xray-core-tmp
          mkdir -p src-tauri/xray-core
          cp xray-core-tmp/xray src-tauri/xray-core/
          cp xray-core-tmp/geoip.dat src-tauri/xray-core/
          cp xray-core-tmp/geosite.dat src-tauri/xray-core/
          chmod +x src-tauri/xray-core/xray

      # Download sing-box for macOS
      - name: Download sing-box
        run: |
          SB_VERSION="$(node -p "require('./runtime-versions.json').sing_box.version")"
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            SB_KEY="darwin_arm64"
          else
            SB_KEY="darwin_amd64"
          fi
          SB_ASSET="$(node -p "require('./runtime-versions.json').sing_box.assets.${SB_KEY}.name")"
          SB_SHA256="$(node -p "require('./runtime-versions.json').sing_box.assets.${SB_KEY}.sha256")"
          curl --fail --location "https://github.com/SagerNet/sing-box/releases/download/v${SB_VERSION}/${SB_ASSET}" -o singbox.tar.gz
          printf '%s  %s\n' "$SB_SHA256" singbox.tar.gz | shasum -a 256 -c -
          tar xzf singbox.tar.gz
          cp "${SB_ASSET%.tar.gz}/sing-box" src-tauri/
          chmod +x src-tauri/sing-box

      - name: Sign macOS runtime binaries
        run: |
          xattr -cr src-tauri/xray-core/xray 2>/dev/null || true
          xattr -cr src-tauri/sing-box 2>/dev/null || true
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" src-tauri/xray-core/xray
          codesign --force --options runtime --timestamp --sign "$APPLE_SIGNING_IDENTITY" src-tauri/sing-box
          codesign --verify --strict --verbose=2 src-tauri/xray-core/xray
          codesign --verify --strict --verbose=2 src-tauri/sing-box

      # Strip trailing whitespace/newlines from signing key
      - name: Clean signing key
        shell: bash
        run: |
          KEY=$(echo -n "${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}" | tr -d '\n\r ')
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY" >> $GITHUB_ENV
          echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "DoodleRay ${{ github.ref_name }}"
          releaseBody: |
            ## 📦 Downloads

            Pick the right installer for your operating system:

            ### 🪟 Windows
            | File | Description |
            |------|-------------|
            | `DoodleRay_x.x.x_x64-setup.exe` | Windows installer (64-bit) — **recommended** |
            | `DoodleRay_x.x.x_x64-setup.nsis.zip` | Portable NSIS archive |

            ### 🍎 macOS
            | File | Description |
            |------|-------------|
            | `DoodleRay_x.x.x_aarch64.dmg` | macOS installer for Apple Silicon (M1/M2/M3/M4) — **recommended for modern Macs** |
            | `DoodleRay_x.x.x_x64.dmg` | macOS installer for Intel Macs |

            ### 🔄 Auto-update
            `latest.json` is used by the built-in updater — you don't need to download it manually.

            ---
            > **Tip:** If you're not sure which file to pick — on **Windows** grab the `.exe`, on **Mac** grab the `.dmg` matching your chip (Apple Silicon = `aarch64`, Intel = `x64`).
          releaseDraft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'BETA') }}
          args: --target ${{ matrix.target }} --config src-tauri/tauri.direct-macos.conf.json

  patch-updater-metadata:
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - name: Point Windows NSIS updater target at updater zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          token = os.environ["GITHUB_TOKEN"]
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]

          def request(url, method="GET", data=None, accept="application/vnd.github+json", content_type=None):
              headers = {
                  "Accept": accept,
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "doodleray-release-metadata",
                  "X-GitHub-Api-Version": "2022-11-28",
              }
              if content_type:
                  headers["Content-Type"] = content_type
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              with urllib.request.urlopen(req) as response:
                  return response.read()

          release = json.loads(request(f"https://api.github.com/repos/{repo}/releases/tags/{tag}"))
          asset = next((asset for asset in release["assets"] if asset["name"] == "latest.json"), None)
          if not asset:
              raise SystemExit("latest.json asset was not found")

          latest = json.loads(request(asset["url"], accept="application/octet-stream"))
          platforms = latest.setdefault("platforms", {})
          win_updater = platforms.get("windows-x86_64")
          if not win_updater:
              raise SystemExit("windows-x86_64 updater target was not found in latest.json")
          if ".nsis.zip" not in win_updater.get("url", ""):
              raise SystemExit(f"windows-x86_64 does not point at the NSIS updater zip: {win_updater.get('url')}")

          platforms["windows-x86_64-nsis"] = dict(win_updater)
          body = json.dumps(latest, ensure_ascii=False, separators=(",", ":")).encode("utf-8")

          request(asset["url"], method="DELETE")
          upload_url = release["upload_url"].split("{", 1)[0]
          upload_url = f"{upload_url}?{urllib.parse.urlencode({'name': 'latest.json'})}"
          request(upload_url, method="POST", data=body, content_type="application/json")
          print("latest.json patched: windows-x86_64-nsis now points at the NSIS updater zip")
          PY
