name: Attach processed macOS TestFlight build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-macos
  cancel-in-progress: false

jobs:
  attach:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - name: Wait for Apple processing and attach the internal QA group
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TESTFLIGHT_INTERNAL_GROUP_NAME: DoodleRay 6.0.2 Private QA
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${APP_STORE_CONNECT_API_KEY_ID}.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          APP_STORE_CONNECT_API_KEY_PATH="$key_path" node scripts/macos/attach-testflight-build.mjs
