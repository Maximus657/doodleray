name: runtime-updates

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
  pull_request:
    paths:
      - runtime-versions.json
      - scripts/update-runtime-versions.py
      - scripts/update-xray-core.ps1
      - scripts/macos/build-libxray.sh
      - scripts/vpn-qa/test-isolated-xray-tun.sh
      - .github/workflows/runtime-updates.yml
      - .github/workflows/ci.yml
      - .github/workflows/release-production.yml

concurrency:
  group: runtime-updates
  cancel-in-progress: false

env:
  CANDIDATE_NAME: runtime-candidate-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve candidate pins once from official metadata
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update-runtime-versions.py

      - name: Validate exact candidate pins and official checksums
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m json.tool runtime-versions.json >/dev/null
          python3 -m py_compile scripts/update-runtime-versions.py
          python3 scripts/update-runtime-versions.py --check
          bash -n scripts/macos/build-libxray.sh scripts/vpn-qa/test-isolated-xray-tun.sh
          mkdir runtime-candidate
          cp runtime-versions.json runtime-candidate/
          (cd runtime-candidate && sha256sum runtime-versions.json > sha256.txt)

      - name: Validate PowerShell updater syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/update-xray-core.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count) {
            $errors | ForEach-Object { Write-Error $_ }
            throw 'PowerShell syntax validation failed'
          }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: runtime-candidate/
          if-no-files-found: error
          retention-days: 7

  macos-smoke:
    needs: resolve
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: runtime-candidate
      - name: Restore the exact resolved candidate
        run: |
          (cd runtime-candidate && shasum -a 256 -c sha256.txt)
          cp runtime-candidate/runtime-versions.json .
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.x'
          cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-26
        with:
          targets: x86_64-apple-darwin
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml --features app-store
      - run: cargo check --manifest-path src-tauri/Cargo.toml --features app-store --target x86_64-apple-darwin
      - name: Build and smoke-test pinned LibXray
        run: |
          scripts/macos/build-libxray.sh
          scripts/macos/test-libxray-loopback.sh
      - name: Compile tracked universal Network Extension without signing
        run: |
          brew install xcodegen
          scripts/macos/generate-extension-project.sh
          git diff --exit-code -- src-tauri/macos/DoodleRayAppStoreExtensions.xcodeproj
          xcodebuild \
            -project src-tauri/macos/DoodleRayAppStoreExtensions.xcodeproj \
            -scheme DoodleRayVPN \
            -destination 'generic/platform=macOS' \
            -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DoodleRayExtension" \
            ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO CODE_SIGNING_ALLOWED=NO build

  windows-smoke:
    needs: resolve
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: runtime-candidate
      - name: Restore the exact resolved candidate
        shell: pwsh
        run: |
          $expected = ((Get-Content runtime-candidate/sha256.txt -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash runtime-candidate/runtime-versions.json -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Runtime candidate artifact digest mismatch' }
          Copy-Item runtime-candidate/runtime-versions.json . -Force
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-26
      - uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Run Windows config, service, TUN and rollback tests
        shell: pwsh
        run: |
          $placeholders = @(
            'src-tauri/DoodleRayService.exe',
            'src-tauri/sing-box.exe',
            'src-tauri/wintun.dll',
            'src-tauri/xray-core/xray.exe',
            'src-tauri/xray-core/geoip.dat',
            'src-tauri/xray-core/geosite.dat'
          )
          foreach ($path in $placeholders) {
            $parent = Split-Path -Parent $path
            if ($parent) { New-Item -ItemType Directory -Path $parent -Force | Out-Null }
            if (-not (Test-Path $path)) { New-Item -ItemType File -Path $path -Force | Out-Null }
          }
          cargo test --manifest-path src-tauri/Cargo.toml --all-targets
          cargo test --manifest-path src-tauri/Cargo.toml --features windows-service --bin DoodleRayService

  update:
    if: github.event_name != 'pull_request'
    needs: [resolve, macos-smoke, windows-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: runtime-candidate

      - name: Restore the exact smoke-tested candidate
        run: |
          (cd runtime-candidate && sha256sum -c sha256.txt)
          cp runtime-candidate/runtime-versions.json .

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- runtime-versions.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Create runtime update PR for human trust review
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: main
        run: |
          branch="codex/runtime-updates-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B "$branch"
          git add runtime-versions.json
          git commit -m 'chore: update VPN runtimes'
          git push origin "HEAD:$branch"

          gh pr create \
            --base "$BASE_BRANCH" \
            --head "$branch" \
            --title 'chore: update VPN runtimes' \
            --body $'Exact candidate manifest resolved once and reused by both platform smoke jobs.\n\n- [x] Official asset digests verified\n- [x] Runtime manifest verified\n- [x] Platform smoke gates\n- [ ] Manual compatibility and trust review required\n\nThis workflow never auto-merges native runtime updates.'
