name: publish-downloads

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Semver version to publish, for example 6.0.0'
        required: true
        type: string
      channel:
        description: 'Release channel'
        required: true
        type: choice
        options:
          - direct
          - store-win32
      allow_unsigned:
        description: 'RC-only unsigned build. Never use for Store submission.'
        type: boolean
        default: false
      publish:
        description: 'Upload artifacts to doodleray.clickflare.click'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL || 'http://timestamp.digicert.com' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Import Store code-signing certificate
        if: ${{ inputs.channel == 'store-win32' && !inputs.allow_unsigned }}
        shell: pwsh
        env:
          STORE_CODESIGN_PFX_B64: ${{ secrets.STORE_CODESIGN_PFX_B64 }}
          STORE_CODESIGN_PFX_PASSWORD: ${{ secrets.STORE_CODESIGN_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:STORE_CODESIGN_PFX_B64)) {
            throw 'STORE_CODESIGN_PFX_B64 is required for signed Store builds'
          }
          if ([string]::IsNullOrWhiteSpace($env:STORE_CODESIGN_PFX_PASSWORD)) {
            throw 'STORE_CODESIGN_PFX_PASSWORD is required for signed Store builds'
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'doodleray-store-codesign.pfx'
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:STORE_CODESIGN_PFX_B64))
          $securePassword = ConvertTo-SecureString $env:STORE_CODESIGN_PFX_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $securePassword
          Remove-Item $pfxPath -Force
          if (-not $cert.Thumbprint) { throw 'Imported certificate has no thumbprint' }
          "WINDOWS_CODESIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Download Windows runtime dependencies
        shell: pwsh
        run: |
          $runtime = Get-Content runtime-versions.json -Raw | ConvertFrom-Json
          $xrayVersion = $runtime.xray.version
          $xrayAsset = $runtime.xray.assets.windows_amd64
          Invoke-WebRequest "https://github.com/XTLS/Xray-core/releases/download/$xrayVersion/$($xrayAsset.name)" -OutFile xray.zip
          if ((Get-FileHash xray.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $xrayAsset.sha256) {
            throw 'Xray archive checksum mismatch'
          }
          Expand-Archive -Path xray.zip -DestinationPath xray-core-tmp
          New-Item -ItemType Directory -Force -Path 'src-tauri/xray-core'
          Copy-Item 'xray-core-tmp/xray.exe' 'src-tauri/xray-core/'
          Copy-Item 'xray-core-tmp/geoip.dat' 'src-tauri/xray-core/'
          Copy-Item 'xray-core-tmp/geosite.dat' 'src-tauri/xray-core/'
          Invoke-WebRequest "https://www.wintun.net/builds/$($runtime.wintun.asset)" -OutFile wintun.zip
          if ((Get-FileHash wintun.zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $runtime.wintun.sha256) {
            throw 'Wintun archive checksum mismatch'
          }
          Expand-Archive -Path wintun.zip -DestinationPath wintun-tmp
          Copy-Item 'wintun-tmp/wintun/bin/amd64/wintun.dll' 'src-tauri/xray-core/'
          Copy-Item 'wintun-tmp/wintun/bin/amd64/wintun.dll' 'src-tauri/'

          $singBoxVersion = $runtime.sing_box.version
          $singBoxAsset = $runtime.sing_box.assets.windows_amd64
          $singBoxZip = Join-Path $env:RUNNER_TEMP 'sing-box-windows-amd64.zip'
          $singBoxExtract = Join-Path $env:RUNNER_TEMP 'sing-box-windows-amd64'
          Invoke-WebRequest "https://github.com/SagerNet/sing-box/releases/download/v$singBoxVersion/$($singBoxAsset.name)" -OutFile $singBoxZip
          if ((Get-FileHash $singBoxZip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $singBoxAsset.sha256) {
            throw 'sing-box archive checksum mismatch'
          }
          Expand-Archive -Path $singBoxZip -DestinationPath $singBoxExtract -Force
          $singBoxExe = Get-ChildItem $singBoxExtract -Recurse -Filter 'sing-box.exe' | Select-Object -First 1
          if (-not $singBoxExe) { throw 'sing-box.exe not found' }
          Copy-Item $singBoxExe.FullName 'src-tauri/sing-box.exe' -Force

      - name: Build tunnel service
        shell: pwsh
        run: |
          if (-not (Test-Path 'src-tauri/DoodleRayService.exe')) {
            New-Item -ItemType File -Path 'src-tauri/DoodleRayService.exe' -Force | Out-Null
          }
          cargo build --release --manifest-path src-tauri/Cargo.toml --bin DoodleRayService --features windows-service
          Copy-Item 'src-tauri/target/release/DoodleRayService.exe' 'src-tauri/' -Force

      - name: Clean Tauri updater signing key
        if: ${{ inputs.channel == 'direct' }}
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY is required for direct-channel updater artifacts'
          }
          $key = ($env:TAURI_SIGNING_PRIVATE_KEY -replace "[`r`n ]", "")
          "TAURI_SIGNING_PRIVATE_KEY=$key" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Store Win32 artifacts
        if: ${{ inputs.channel == 'store-win32' }}
        shell: pwsh
        run: |
          $args = @('-OutDir', 'dist-downloads')
          if ('${{ inputs.allow_unsigned }}' -eq 'true') { $args += '-AllowUnsigned' }
          ./scripts/build-store.ps1 @args

      - name: Build direct-channel artifacts
        if: ${{ inputs.channel == 'direct' }}
        shell: pwsh
        run: |
          npx tauri build --bundles nsis
          New-Item -ItemType Directory -Force -Path dist-downloads | Out-Null
          Get-ChildItem src-tauri/target/release/bundle/nsis -File |
            Copy-Item -Destination dist-downloads -Force

      - name: Publish to first-party downloads host
        if: ${{ inputs.publish }}
        shell: pwsh
        env:
          DOWNLOADS_SSH_PRIVATE_KEY: ${{ secrets.DOWNLOADS_SSH_PRIVATE_KEY }}
          DOWNLOADS_SSH_HOST: ${{ vars.DOWNLOADS_SSH_HOST || 'doodleray.clickflare.click' }}
          DOWNLOADS_SSH_USER: ${{ vars.DOWNLOADS_SSH_USER || 'root' }}
          DOWNLOADS_SSH_PORT: ${{ vars.DOWNLOADS_SSH_PORT || '22' }}
          DOWNLOADS_REMOTE_ROOT: ${{ vars.DOWNLOADS_REMOTE_ROOT || '/srv/doodleray-downloads' }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:DOWNLOADS_SSH_PRIVATE_KEY)) {
            throw 'DOWNLOADS_SSH_PRIVATE_KEY is required when publish=true'
          }
          $keyPath = Join-Path $env:RUNNER_TEMP 'downloads_ed25519'
          $env:DOWNLOADS_SSH_PRIVATE_KEY -replace "`r", "" | Set-Content -LiteralPath $keyPath -NoNewline -Encoding ascii
          icacls $keyPath /inheritance:r /grant:r "$env:USERNAME`:R" | Out-Null
          ./scripts/release/Publish-DoodleRayDownloads.ps1 `
            -Version '${{ inputs.version }}' `
            -Channel '${{ inputs.channel }}' `
            -ArtifactDir dist-downloads `
            -HostName $env:DOWNLOADS_SSH_HOST `
            -User $env:DOWNLOADS_SSH_USER `
            -Port ([int]$env:DOWNLOADS_SSH_PORT) `
            -RemoteRoot $env:DOWNLOADS_REMOTE_ROOT `
            -SshKeyPath $keyPath

      - name: Archive artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doodleray-${{ inputs.channel }}-${{ inputs.version }}
          path: dist-downloads/
          retention-days: 30
